# Vaste lijst voor de kennisbank.
#
# Alleen personen en onderwerpen uit deze lijst komen in de gespreksbestanden,
# op INDEX.md en krijgen een eigen pagina. Varianten (bijnamen, spelfouten van de
# spraakherkenning, afkortingen) zet je onder `aliassen`; die worden samengevoegd
# tot `naam`.
#
# Namen die niet in deze lijst staan worden in samenvattingen vervangen door
# "[naam]" en verschijnen niet in de kennisbank — zo blijven klantcontacten
# en andere externe personen er standaard uit. Nieuwe kandidaten (met aantallen)
# vind je na elke `npm run kb:enrich` in _beheer/kandidaten.md.
#
# Na het aanpassen van deze lijst: `npm run kb` (de LLM wordt niet opnieuw
# aangeroepen; bestaande extracties worden alleen opnieuw gekoppeld).

personen: []
#  - naam: Jan Jansen
#    aliassen: [Jan, J. Jansen, Jansen]
#    organisatie: Zig
#    rol: Product owner

onderwerpen: []
#  - naam: Datamigratie
#    aliassen: [data migratie, migratie van klantdata]
#    omschrijving: Overzetten van klantdata naar het nieuwe platform

# Gesprekstypes waaruit de LLM kiest. `overig` wordt altijd toegevoegd.
types: [overleg, 1-op-1, klantgesprek, stuurgroep, workshop, presentatie, sollicitatie, overig]
